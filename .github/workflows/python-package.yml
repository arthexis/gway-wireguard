name: Python Package

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  package:
    name: python / Package
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Check distributions exist
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Clean wheel install
        shell: bash
        run: |
          python -m venv /tmp/gway-wire-package-install
          /tmp/gway-wire-package-install/bin/python -m pip install --upgrade pip
          /tmp/gway-wire-package-install/bin/python -m pip install dist/*.whl
          /tmp/gway-wire-package-install/bin/python -m pip check
      - name: Installed package smoke check
        shell: bash
        run: |
          source /tmp/gway-wire-package-install/bin/activate
          python -c "import gway_wire; import gway_wireguard"
