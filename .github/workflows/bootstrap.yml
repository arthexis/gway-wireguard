name: Bootstrap CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n install.sh uninstall.sh server/install.sh
          bash -n client/manual-setup.sh server/manual-setup.sh
          bash -n tests/client/test-install.sh

      - name: Validate version format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Validate project files
        run: |
          test -s README.md
          test -s PLAN.md
          test -s LICENSE
          test -s VERSION
          test -s docs/phase-1.md
          test -s docs/phase-2.md

      - name: Verify manual helpers expose non-mutating help
        run: |
          ./client/manual-setup.sh --help >/dev/null
          ./server/manual-setup.sh --help >/dev/null

      - name: Test Phase 2 client installer validation
        run: ./tests/client/test-install.sh

      - name: Verify future installers remain disabled
        run: |
          ! ./uninstall.sh
          ! ./server/install.sh
