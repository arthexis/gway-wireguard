name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n install.sh uninstall.sh server/install.sh
          bash -n client/manual-setup.sh server/manual-setup.sh
          bash -n tests/client/test-install.sh tests/client/test-cleanup-regression.sh

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            client/enroll.py \
            server/registry.py \
            server/hosts_manager.py \
            server/peer_manager.py \
            server/enroll_api.py \
            server/admin.py \
            src/gway_wireguard/__init__.py \
            src/gway_wireguard/config.py \
            src/gway_wireguard/registry.py \
            src/gway_wireguard/hosts_manager.py \
            src/gway_wireguard/peer_manager.py \
            src/gway_wireguard/admin_ops.py \
            src/gway_wireguard/dns/__init__.py \
            src/gway_wireguard/dns/provider.py \
            src/gway_wireguard/dns/godaddy.py \
            src/gway_wireguard/dns/service.py \
            src/gway_wireguard/gway/__init__.py \
            src/gway_wireguard/gway/peer.py \
            src/gway_wireguard/gway/device.py \
            src/gway_wireguard/gway/hosts.py \
            src/gway_wireguard/gway/token.py \
            src/gway_wireguard/gway/dns.py

      - name: Validate version format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Validate project files
        run: |
          test -s README.md
          test -s PLAN.md
          test -s LICENSE
          test -s VERSION
          test -s pyproject.toml
          test -s gway.toml
          test -s docs/phase-1.md
          test -s docs/phase-2.md
          test -s docs/phase-3.md
          test -s docs/phase-4.md
          test -s server/systemd/gway-wireguard-enroll.service

      - name: Install Python package
        run: python3 -m pip install -e .

      - name: Test GWAY command namespace
        run: python3 -m unittest discover -s tests/gway -p 'test_*.py' -v

      - name: Test base GWAY compatibility
        run: |
          python3 -m pip install 'git+https://github.com/arthexis/gway.git@main'
          export GWAY_DATA_HOME="${RUNNER_TEMP}/gway-data"
          export GWAY_CONFIG_HOME="${RUNNER_TEMP}/gway-config"
          gway register .
          gway wireguard status --json
          gway wg status --json
          gway wireguard token create --help
          gway wireguard device revoke --help
          gway wireguard hosts sync --help
          gway wireguard dns status --json
          gway wireguard dns sync --help
          gway wireguard dns ensure --help
          gway wireguard dns delete --help

      - name: Test client validation
        run: |
          ./tests/client/test-install.sh
          bash ./tests/client/test-cleanup-regression.sh
          python3 -m unittest discover -s tests/client -p 'test_*.py' -v

      - name: Test enrollment server
        run: |
          ./server/install.sh --check
          python3 -m unittest discover -s tests/server -p 'test_*.py' -v

      - name: Verify administrative help paths
        run: |
          ./client/manual-setup.sh --help >/dev/null
          ./server/manual-setup.sh --help >/dev/null
          python3 client/enroll.py --help >/dev/null
          python3 server/admin.py --help >/dev/null

      - name: Verify future client uninstall remains disabled
        run: "! ./uninstall.sh"
