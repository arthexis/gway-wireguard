name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Repository-local integration workflow; shared CI definitions are copied in, not invoked.
jobs:
  validate:
    name: WireGuard integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n install.sh uninstall.sh server/install.sh
          bash -n client/manual-setup.sh server/manual-setup.sh
          bash -n tests/client/test-install.sh tests/client/test-cleanup-regression.sh

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            client/enroll.py \
            server/registry.py \
            server/hosts_manager.py \
            server/peer_manager.py \
            server/enroll_api.py \
            server/admin.py
          python3 -m compileall -q src/gway_wire src/gway_wireguard

      - name: Validate version format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Validate project files
        run: |
          test -s README.md
          test -s PLAN.md
          test -s LICENSE
          test -s VERSION
          test -s pyproject.toml
          test -s gway.toml
          test -s docs/phase-1.md
          test -s docs/phase-2.md
          test -s docs/phase-3.md
          test -s docs/phase-4.md
          test -s docs/pre-phase-5-hardening.md
          test -s server/systemd/gway-wireguard-enroll.service

      - name: Install Python package
        run: python3 -m pip install -e .

      - name: Test base GWAY compatibility
        run: |
          python3 -m pip install 'git+https://github.com/arthexis/gway.git@main'
          export GWAY_DATA_HOME="${RUNNER_TEMP}/gway-data"
          export GWAY_CONFIG_HOME="${RUNNER_TEMP}/gway-config"
          gway register .
          gway wire status --json
          gway wire status --server --json
          gway wire status --client --json
          gway wire sync --help
          gway wire client status --json
          gway wire client sync --help
          gway wire client enroll --help
          gway wire server token --help
          gway wire server devices --help
          gway wire server revoke --help
          gway wire server hosts sync --help
          gway wire server dns status --json
          gway wire server dns sync --help
          gway wire server dns ensure --help
          gway wire server dns delete --help
          gway wire server deploy --help
          gway wire server status --help
          gway wire server check --help
          gway wireguard status --json
          gway wg status --json

      - name: Test first-class GWAY Sigils
        shell: bash
        run: |
          export GWAY_DATA_HOME="${RUNNER_TEMP}/gway-data"
          export GWAY_CONFIG_HOME="${RUNNER_TEMP}/gway-config"

          lazy="$(gway wire client status --interface '[project.name]' --json)"
          command="$(gway wire client status --interface '[command.name]' --json)"
          eager="$(gway wire client status --interface '%[cwd]' --json)"
          mixed="$(gway wg client status --interface '%[cwd]/[project.name]/[command.name]' --json)"

          python3 - "$lazy" "$command" "$eager" "$mixed" <<'PY'
          import json
          import os
          import sys

          lazy, command, eager, mixed = (json.loads(value) for value in sys.argv[1:])
          cwd = os.getcwd()

          assert lazy["interface"] == "wire"
          assert command["interface"] == "status"
          assert eager["interface"] == cwd
          assert mixed["interface"] == f"{cwd}/wire/status"

          for result in (lazy, command, eager, mixed):
              assert result["configured"] is False
          PY

      - name: Test client validation
        run: |
          ./tests/client/test-install.sh
          bash ./tests/client/test-cleanup-regression.sh
          python3 -m unittest discover -s tests/client -p 'test_*.py' -v

      - name: Test enrollment server
        run: |
          ./server/install.sh --check
          python3 -m unittest discover -s tests/server -p 'test_*.py' -v

      - name: Verify administrative help paths
        run: |
          ./client/manual-setup.sh --help >/dev/null
          ./server/manual-setup.sh --help >/dev/null
          python3 client/enroll.py --help >/dev/null
          python3 server/admin.py --help >/dev/null

      - name: Verify future client uninstall remains disabled
        run: "! ./uninstall.sh"
