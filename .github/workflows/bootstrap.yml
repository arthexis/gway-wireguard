name: Bootstrap CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n install.sh uninstall.sh server/install.sh

      - name: Validate version format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Validate bootstrap files
        run: |
          test -s README.md
          test -s PLAN.md
          test -s LICENSE
          test -s VERSION

      - name: Verify installers fail closed during bootstrap
        run: |
          ! ./install.sh
          ! ./uninstall.sh
          ! ./server/install.sh
