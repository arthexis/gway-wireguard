name: Ubuntu 22 Live Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This workflow intentionally never runs for pull_request. The self-hosted runner
# is the live Ubuntu 22 gateway, so only trusted main commits from the repository
# owner may execute here.
# Only the newest live run matters; replace any stale queued/in-progress run so
# manual retries and fresh main pushes can reach the single gateway runner.
concurrency:
  group: ubuntu22-live-gateway
  cancel-in-progress: true

jobs:
  live:
    if: github.actor == 'arthexis'
    name: Live gateway readiness
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Verify trusted Ubuntu 22 gateway
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "22.04"
          uname -a
          python3 --version
          sudo -n true

      - name: Upgrade Wire from main
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade wire --force

      # Keep Web last so Wire's package dependency cannot replace a newer Web
      # checkout. This makes the live gateway exercise current gway-web main.
      - name: Upgrade Web from main
        shell: bash
        run: |
          set -euo pipefail
          if sudo -n gway web --help >/dev/null 2>&1; then
            sudo -n gway upgrade web --force
          else
            sudo -n gway install web
          fi

      - name: Diagnose installed Web runtime
        shell: bash
        run: |
          set -euo pipefail
          GWAY_BIN="$(sudo -n sh -c 'command -v gway')"
          GWAY_PYTHON="/opt/gway/venv/bin/python"
          test -x "${GWAY_PYTHON}"
          echo "gway executable: ${GWAY_BIN}"
          echo "gway wrapper header:"
          sudo -n sed -n '1,20p' "${GWAY_BIN}"
          echo "gway python: ${GWAY_PYTHON}"
          sudo -n "${GWAY_PYTHON}" - <<'PY'
          import importlib.metadata as metadata
          import inspect
          import sys

          import gway_web
          import gway_web.certbot
          import gway_web.exposure

          print("python:", sys.executable)
          print("gway-web version:", metadata.version("gway-web"))
          print("gway_web:", gway_web.__file__)
          print("gway_web.certbot:", gway_web.certbot.__file__)
          print("gway_web.exposure:", gway_web.exposure.__file__)
          renew_source = inspect.getsource(gway_web.certbot.renew)
          print("managed-cert reuse guard present:", "deploy_hook is None and current.ready" in renew_source)
          PY

      - name: Deploy live enrollment endpoint
        shell: bash
        run: |
          set -euo pipefail
          GWAY_PYTHON="/opt/gway/venv/bin/python"
          test -x "${GWAY_PYTHON}"
          sudo -n "${GWAY_PYTHON}" - <<'PY'
          import pprint

          from gway_wire.surface.server import deploy

          result = deploy(
              fqdn="register.arthexis.com",
              cert_email="tecnologia@gelectriic.com",
          )
          pprint.pp(result)
          if not result.get("success"):
              raise SystemExit(1)
          PY

      - name: Verify live readiness and public health
        shell: bash
        run: |
          set -uo pipefail
          status=0

          sudo -n gway wire server check --fqdn register.arthexis.com || status=$?

          if ! curl \
            --fail \
            --show-error \
            --silent \
            --max-time 10 \
            https://register.arthexis.com/health; then
            status=1
          else
            echo
          fi

          exit "${status}"
