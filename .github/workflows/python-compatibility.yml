name: Python Compatibility

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests/gway -p 'test_*.py' -v

  compatibility:
    name: python / Python compatibility
    if: always() && needs.tests.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        shell: bash
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
