name: Gway Integration

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gway-integration:
    name: Gway Integration
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Build and install current wheel with Gway
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install 'git+https://github.com/arthexis/gway.git@main'
          python -m pip install dist/*.whl

      - name: Exercise current gway.toml
        env:
          GWAY_DATA_HOME: ${{ runner.temp }}/gway-data-pr
          GWAY_CONFIG_HOME: ${{ runner.temp }}/gway-config-pr
        run: |
          gway register .
          gway info wire --json
          gway wire status --json
          gway wireguard status --json
          gway wg status --json
          gway wire client enroll --help
          gway wire server token --help

      - name: Exercise managed Gway install from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GWAY_DATA_HOME: ${{ runner.temp }}/gway-data-install
          GWAY_CONFIG_HOME: ${{ runner.temp }}/gway-config-install
        run: |
          gway install wire
          gway info wire --json
          gway wire status --json
          gway wireguard status --json
          gway wg status --json
