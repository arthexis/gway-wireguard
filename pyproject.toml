[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-wire"
version = "0.3.1"
description = "Endpoint connectivity for Gway devices, with WireGuard as the first backend"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Minimum compatible Web API: 0.1.0. Track latest main until gway-web is published.
    "gway-web @ git+https://github.com/arthexis/gway-web.git@main",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "I001"]
